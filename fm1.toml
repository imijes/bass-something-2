# Bass Something 2's build settings (tools/build.py)
name = "Bass-Something-2"      # APP_NAME is in app.h; this names the build's files (bass-something-2.fwsc,
                               # bass-something-2_host); bs2/site/make_site.py shows it as "Bass Something 2"
id_prefix = "FM-1_69"          # package identity (each firmware its own, since v0.7.3; was FM-1_62, which Veffbox also uses): dev FM-1_6900, releases FM-1_69XXYYZZ (8 digits at most)
usb_manufacturer = "imijes"
usb_product = "Bass Something 2 FM-1"   # "fm-1" in it: the installer and fm1_install.py find the port by that
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI devices too
usb_midi_last = true           # MIDI after the audio streaming interfaces (felucca-bsp FELUCCA_UAC_MIDI_LAST, the
                               # default): macOS 13-15 show the FM-1 as an audio device beside its MIDI
backup = true                  # backup and restore over USB (device/backup.c, tools/fm1_backup.py, web/backup)
backup_ext = "bs2"             # (the site's backup page: its files, what they hold)
backup_holds = "the patches, the sequences, the drums' patterns and songs, the RND seeds and the settings"
authors = ["John Brown"]       # the .rfm1's manifest (tools/build.py bs2 --rfm1: RemoteFM1 for iOS)
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "a monosynth inspired by the legendary Novation Bass Station II, built for the M-VAVE FM-1"
repo = "https://github.com/imijes/bass-something-2"   # the source
licence = "MPL-2.0"
# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md); a --release needs all four
description = "Bass Something 2 turns the M-VAVE FM-1 into two instruments. A monosynth inspired by the Novation Bass Station II, with two oscillators, a sub, filters, envelopes, LFOs, an arpeggiator, a 32-step sequencer and Bass Station II patch dumps. And Drum Something, a drum machine inspired by the Sequential Circuits Drumtraks: thirteen synthesized voices, patterns, songs and MIDI out. It is also a companion for Cyma Forma's RND Synth."
tags = ["synth", "drum-machine", "sequencer", "midi"]
install = "https://imijes.github.io/bass-something-2/install/"
screenshot = "docs/img/screen-home.png"
credits = "by John Brown (https://github.com/imijes), with the work of others, all credited in the manual's section 13: https://imijes.github.io/bass-something-2/manual/#s13"
                               # (the .rfm1's credits; the installer's footer is bs2/site/make_site.py FOOTER's)
